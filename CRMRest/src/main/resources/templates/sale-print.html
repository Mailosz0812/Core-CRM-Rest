<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Wydruk Zamówienia</title>
    <style>
        /* Konfiguracja strony PDF (format A4, marginesy) */
        @page {
            size: A4;
            margin: 5mm 15mm;
        }

        /* Podstawowy reset i typografia */
        body {
            font-family: "Roboto", sans-serif;
            color: #333333;
            line-height: 1.4;
            font-size: 11pt;
        }

        /* 1. NAZWA (Tytuł) */
        .header-title {
            font-size: 24pt;
            font-weight: bold;
            margin-bottom: 20px;
            color: #111827;
        }

        .client-info {
            font-size: 11pt;
            color: #4b5563;
            margin-bottom: 25px;
        }

        .note-box {
            border: 2px solid #e5e7eb;
            background-color: #f9fafb;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 6px;
        }

        .note-title {
            font-size: 10pt;
            font-weight: bold;
            text-transform: uppercase;
            color: #6b7280;
            margin-bottom: 5px;
        }

        /* 3. TABELKA */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            table-layout: fixed; /* Gwarantuje respektowanie szerokości podanych w % */
        }

        th, td {
            border: 1px solid #d1d5db;
            padding: 8px 10px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background-color: #f3f4f6;
            font-weight: bold;
            font-size: 11pt;
            color: #374151;
        }

        /* Klasa wymuszająca bezpieczne zawijanie tekstu */
        .wrap-content {
            white-space: normal !important;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* Klasa blokująca zawijanie (np. dla dat i liczb) */
        .no-wrap {
            white-space: nowrap !important;
        }

        .product-internal {
            font-weight: bold;
            color: #111827;
            font-size: 11pt;
            margin-bottom: 2px;
        }

        .product-name {
            font-size: 10pt;
            color: #6b7280;
        }

        .cell-center {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="header-title" th:text="${saleName}"></div>

<div class="client-info">
    Klient: <strong th:text="${clientName}"></strong><br />
    NIP: <span th:text="${clientNip}"></span><br />
    Adres: <span th:text="${address}"></span><br />
    Telefon: <span th:text="${clientPhone}"></span><br />
</div>

<div class="note-box" th:if="${warehouseNote != null and !warehouseNote.isEmpty()}">
    <div class="note-title">Notatka do zamówienia:</div>
    <div th:text="${warehouseNote}"></div>
</div>

<table>
    <thead>
    <tr>
        <th style="width: 6%; text-align: center;">Lp.</th>
        <th style="width: 36%;">Produkt</th>
        <th style="width: 15%; text-align: center;">TPS</th>
        <th style="width: 16%; text-align: center;">Kategoria</th>
        <th style="width: 15%; text-align: center;">Producent</th>
        <th style="width: 12%; text-align: center;">Ilość</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item, iterStat : ${saleItems}">
        <td class="no-wrap cell-center" th:text="${iterStat.count}"></td>
        <td class="wrap-content">
            <div class="product-internal" th:text="${item.internal}"></div>
            <div class="product-name" th:text="${item.name}"></div>
        </td>
        <td class="no-wrap cell-center" style="font-weight: bold; font-size: 11pt;">
            <div th:text="${#temporals.format(item.tps.atZoneSameInstant(T(java.time.ZoneId).of('Europe/Warsaw')), 'dd.MM.yyyy')}"></div>
        </td>
        <td class="wrap-content cell-center" style="font-weight: bold; font-size: 11pt;">
            <div th:text="${item.category}"></div>
        </td>
        <td class="wrap-content cell-center" style="font-weight: bold; font-size: 11pt;">
            <div th:text="${item.producer}"></div>
        </td>
        <td class="no-wrap cell-center" style="font-weight: bold; font-size: 11pt;">
            <div th:text="${item.amount}"></div>
            <div style="font-size: 9pt; font-weight: normal; color: #4b5563;" th:text="${item.unit}"></div>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
