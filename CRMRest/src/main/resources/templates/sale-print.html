<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Wydruk Zamówienia</title>
    <style>
        /* Konfiguracja strony PDF (format A4, marginesy) */
        @page {
            size: A4;
            margin: 5mm 15mm;
        }

        /* Podstawowy reset i typografia */
        body {
            font-family: "Roboto", sans-serif;
            color: #333333;
            line-height: 1.5;
            font-size: 12pt;
        }

        /* 1. NAZWA (Tytuł) */
        .header-title {
            font-size: 24pt;
            font-weight: bold;
            margin-bottom: 20px;
            color: #111827;
        }

        .client-info {
            font-size: 11pt;
            color: #4b5563;
            margin-bottom: 25px;
        }
        .note-box {
            border: 2px solid #e5e7eb;
            background-color: #f9fafb;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 6px;
        }

        .note-title {
            font-size: 10pt;
            font-weight: bold;
            text-transform: uppercase;
            color: #6b7280;
            margin-bottom: 5px;
        }

        /* 3. TABELKA */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #d1d5db;
            padding: 10px 12px;
            text-align: left;
        }

        th {
            background-color: #f3f4f6;
            font-weight: bold;
            font-size: 11pt;
            color: #374151;
        }

        td {
            font-size: 11pt;
        }


        .product-internal {
            font-weight: bold;
            color: #111827;
        }

        .product-name {
            font-size: 10pt;
            color: #6b7280;
        }
    </style>
</head>
<body>

<div class="header-title" th:text="${saleName}"></div>

<div class="client-info">
    Klient: <strong th:text="${clientName}"></strong><br />
    NIP: <span th:text="${clientNip}"></span><br />
    Adres: <span th:text="${address}"></span><br />
    Telefon: <span th:text="${clientPhone}"></span><br />
</div>

<div class="note-box" th:if="${warehouseNote != null and !warehouseNote.isEmpty()}">
    <div class="note-title">Notatka do zamówienia:</div>
    <div th:text="${warehouseNote}">
    </div>
</div>

<table>
    <thead>
    <tr>
        <th style="width: 5%;">Lp.</th>
        <th style="width: 35%;">Produkt</th>
        <th style="width: 20%; text-align: center;">TPS</th>
        <th style="width: 20%; text-align: center;">Kategoria</th>
        <th style="width: 20%; text-align: center;">Ilość</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item, iterStat : ${saleItems}">
        <td th:text="${iterStat.count}">1</td>
        <td>
            <div class="product-internal" th:text="${item.internal}"></div>
            <div class="product-name" th:text="${item.name}"></div>
        </td>
        <td style="text-align: center; font-weight: bold; font-size: 12pt;">
            <div  th:text="${#temporals.format(item.tps, 'dd.MM.yyyy')}"></div>
        </td>
        <td style="text-align: center; font-weight: bold; font-size: 12pt;">
            <div  th:text="${item.category}"></div>
        </td>
        <td style="text-align: center; font-weight: bold; font-size: 12pt;">
            <span th:text="${item.amount}"></span>
            <span style="font-size: 10pt; font-weight: normal;" th:text="${item.unit}"></span>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
