<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Wydruk Cennika</title>
    <style>
        /* Optymalizacja pod format A4 */
        @page {
            size: A4;
            margin: 8mm 12mm;
        }

        body {
            font-family: "Roboto", sans-serif;
            color: #000;
            line-height: 1.2; /* Lekko zwiększona interlinia dla lepszej czytelności */
            font-size: 9.5pt; /* Zwiększono z 8.5pt */
        }

        .header-top {
            width: 100%;
            border-bottom: 2px solid #000;
            margin-bottom: 10px;
            padding-bottom: 2px;
        }

        .date-box {
            float: right;
            font-weight: bold;
            font-size: 11pt; /* Zwiększono z 10pt */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid #000;
            padding: 3px 5px; /* Minimalnie zwiększony górny i dolny margines wewnętrzny */
            overflow: hidden;
        }

        /* Nagłówki główne */
        th {
            background-color: #f3f4f6;
            text-transform: uppercase;
            font-size: 8.5pt; /* Zwiększono z 7.5pt */
            font-weight: bold;
        }

        /* Wiersz kategorii - ciemniejszy szary pasek */
        .category-row {
            background-color: #d1d5db;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 10.5pt; /* Zwiększono z 9pt */
        }

        /* Szerokości kolumn */
        .col-lp { width: 25px; text-align: center; }
        .col-name { width: auto; text-align: left; }
        .col-unit { width: 30px; text-align: center; }
        .col-pack { width: 55px; text-align: center; }
        .col-price { width: 60px; text-align: right; font-weight: bold; }
        .col-tps { width: 75px; text-align: center; } /* Lekko poszerzona, żeby zmieścić większą datę */

        /* Styl dla nazwy produktu */
        .product-name {
            font-weight: bold;
            font-size: 9.5pt; /* Zwiększono z 8.5pt */
        }

        /* Styl dla nazwy producenta w nawiasie */
        .producer-tag {
            font-size: 8pt; /* Zwiększono z 7pt */
            color: #4b5563;
            font-weight: normal;
            margin-left: 4px;
        }

        .clear { clear: both; }
    </style>
</head>
<body>

<div class="header-top">
    <div class="date-box" th:text="${#temporals.format(#temporals.createNow(), 'dd.MM.yyyy')}"></div>
    <div style="font-weight: bold; font-size: 12pt; text-transform: uppercase;">NAZWA</div>
    <div class="clear"></div>
</div>

<table>
    <thead>
    <tr>
        <th class="col-lp"></th>
        <th class="col-name">NAZWA</th>
        <th class="col-unit">jm.</th>
        <th class="col-pack">OPAK.</th>
        <th class="col-price">CENA</th>
        <th class="col-tps">TPS</th>
    </tr>
    </thead>
    <tbody>
    <th:block th:each="prod, iterStat : ${products}">

        <tr th:if="${iterStat.first or prod.category != products[iterStat.index - 1].category}" class="category-row">
            <td colspan="6" th:text="${prod.category}">KATEGORIA PRODUKTÓW</td>
        </tr>

        <tr>
            <td class="col-lp" th:text="${iterStat.count}"></td>
            <td>
                <span class="product-name" th:text="${prod.name}">NAZWA PRODUKTU</span>
                <span class="producer-tag" th:if="${prod.producer != null}" th:text="'(' + ${prod.producer} + ')'"></span>
            </td>
            <td class="col-unit" th:text="${prod.unit != null ? prod.unit.toString().toLowerCase() : ''}"></td>
            <td class="col-pack" th:text="${prod.pack}"></td>
            <td class="col-price" th:text="${#numbers.formatDecimal(prod.unitPrice, 1, 2, 'COMMA')} + ' zł'"></td>
            <td class="col-tps" th:text="${prod.tps != null ? #temporals.format(prod.tps.atZoneSameInstant(T(java.time.ZoneId).of('Europe/Warsaw')), 'dd.MM.yyyy') : 'X'}"></td>
        </tr>
    </th:block>
    </tbody>
</table>

<div style="margin-top: 20px; font-size: 8pt; border-top: 1px solid #eee; padding-top: 5px;">
    <p>Notatki:</p>
    <div style="border-bottom: 1px dashed #ccc; height: 20px;"></div>
    <div style="border-bottom: 1px dashed #ccc; height: 20px;"></div>
</div>

</body>
</html>
